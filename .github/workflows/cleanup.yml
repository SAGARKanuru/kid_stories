name: Clean up old files

on:
  schedule:
    - cron: "17 2 * * *"     # every day, 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup.yml"]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete saved videos and other run files older than 2 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let deleted = 0, freed = 0;
            for (const a of artifacts) {
              if (!a.expired && new Date(a.created_at).getTime() < cutoff) {
                await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
                deleted++; freed += a.size_in_bytes;
                core.info(`deleted ${a.name} from ${a.created_at} (${(a.size_in_bytes / 1e6).toFixed(1)} MB)`);
              }
            }
            core.notice(`Deleted ${deleted} old file(s), freed ${(freed / 1e6).toFixed(1)} MB.`);
