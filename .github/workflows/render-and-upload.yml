name: Render & upload episode

on:
  push:
    branches: [main]
    paths: ["episodes/**/story.json", "kidsvideo/**", "config.yaml", "requirements.txt"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder to (re)render, e.g. episodes/2026-10-07 (blank = all pending)"
        required: false
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true

concurrency:
  group: render-upload
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, Cairo and espeak-ng
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libcairo2 espeak-ng

      - name: Cache backup voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Render (and upload)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.episode }}" ]; then ARGS="--episode ${{ github.event.inputs.episode }}"; fi
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YouTube secrets are not set yet - rendering only. See README step 3."
            ARGS="$ARGS --no-upload"
          fi
          python -m kidsvideo.run $ARGS

      - name: Record upload in the repo
        if: always()
        run: |
          git config user.name "kids-story-bot"
          git config user.email "kids-story-bot@users.noreply.github.com"
          git add data/history.json data/playlists.json data/shorts.json episodes/*/upload.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record uploaded episode [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
