name: Voice samples

on:
  workflow_dispatch:

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libcairo2
      - run: pip install -r requirements.txt
      - run: python tools/voice_samples.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: voice-samples/*.mp3
          retention-days: 7
