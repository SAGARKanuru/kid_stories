# Daily kids' story channel — settings. Edit and commit; the next run picks them up.

channel_name: "Little Lantern Stories"

story:
  language: "English"
  audience: "children aged 3 to 8"
  scenes: [8, 10]                # scenes per episode -> roughly 3-4 minute videos
  themes:                        # the daily task rotates through these
    - kindness
    - sharing
    - honesty
    - courage
    - patience
    - gratitude
    - teamwork
    - curiosity
    - trying again after failing
    - listening to others
    - caring for nature
    - making a new friend
    - saying sorry
    - helping at home
    - being yourself
    - healthy habits
    - respecting elders
    - managing big feelings

  learning_topics:              # each episode teaches ONE of these, rotated, woven into the story
    - counting 1 to 5
    - counting 1 to 10
    - colours of the rainbow
    - shapes (circle, square, triangle, star, heart)
    - big and small
    - opposites (up/down, hot/cold, fast/slow)
    - animal sounds
    - what animals eat
    - baby animals and their names
    - the five senses
    - parts of the body
    - days of the week
    - fruits and vegetables
    - how plants grow
    - weather (sun, rain, wind, snow)
    - day and night
    - first letters of words (A is for apple)
    - rhyming words
    - simple patterns (red, blue, red, blue)
    - healthy habits (washing hands, brushing teeth)
    - road safety (look left and right)
    - feelings and their names
    - sink or float
    - insects and bugs
    - seasons

voice:
  # Narrator: a cheerful kid storyteller (free Microsoft neural voices via edge-tts).
  # Child voices: en-US-AnaNeural (American girl), en-GB-MaisieNeural (British girl).
  # Grown-up options: en-IN-NeerjaNeural (Indian English), en-US-JennyNeural, en-GB-SoniaNeural.
  # Run the "Voice samples" workflow in GitHub Actions to hear them before changing.
  narrator: "en-IN-NeerjaNeural"   # Indian-English storyteller, shifted to sound like a cheerful kid
  rate: "-6%"        # a little slower so 3-5 year olds can follow
  pitch: "+0Hz"
  shift: 2.5         # semitones of "cartoon child" pitch+timbre shift (0 = natural voice; try 0 to 2)
  engine: "auto"     # auto = Microsoft voices, or the offline Kokoro backup if Microsoft's service is down
  backup:            # Kokoro voice used when Microsoft's service is down
    voice: "af_heart"
    speed: 0.94
    shift: 3.0

video:
  width: 1920
  height: 1080
  fps: 24
  captions: true
  music_volume: 0.10
  ambience_volume: 0.16
  sfx_volume: 0.45

youtube:
  privacy: "public"              # YouTube keeps API uploads private until Google approves the API audit (see README)
  category_id: "1"               # 1 = Film & Animation, 27 = Education
  made_for_kids: true            # required for children's content (COPPA)
  contains_synthetic_media: true # discloses AI-generated story, art and voices
  default_language: "en"
  shorts: true                   # also upload a vertical YouTube Short (< 60 s) of each episode's funniest part
  shorts_from: "2026-11-23"      # make Shorts for episodes from this date on (older ones are skipped)
  playlists: true                # put every video into topic playlists (Learn Counting, Bedtime Stories, ...)
  playlist_adds_per_run: 100     # older videos are added a batch at a time to stay within YouTube's daily limit
  delete_duplicates: false       # true = remove extra copies of this pipeline's episodes only (keeps one); never touches your own uploads
  playlist_id: ""                # optional: add each upload to this playlist
